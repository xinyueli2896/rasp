172" text-anchor="middle" class="lbl">attn @ V</text><line x1="438" y1="72" x2="486" y2="116" class="arw" marker-end="url(#ar-ink)"/><text x="452" y="96" class="mono">Q</text><line x1="438" y1="150" x2="486" y2="144" class="arwf" marker-end="url(#ar-flow)"/><text x="452" y="138" class="monof">K</text><line x1="438" y1="216" x2="486" y2="176" class="arwf" marker-end="url(#ar-flow)"/><text x="452" y="200" class="monof">V</text><line x1="710" y1="144" x2="756" y2="144" class="arw" marker-end="url(#ar-ink)"/><rect x="758" y="124" width="150" height="40" rx="4" class="bxa"/><text x="769" y="148.0" class="lblf">out_proj</text><text x="897" y="148.0" text-anchor="end" class="tag">256→768</text><line x1="833" y1="164" x2="833" y2="194" class="arw" marker-end="url(#ar-ink)"/><circle cx="833" cy="212" r="18" class="bxa"/><text x="833" y="217" text-anchor="middle" class="lblf">× g</text><text x="858" y="216" class="tag">learned gate</text><line x1="833" y1="230" x2="833" y2="262" class="arw" marker-end="url(#ar-ink)"/><rect x="610" y="264" width="350" height="40" rx="4" class="bx"/><text x="626" y="289" class="lbl">h[t]  ←  h[t]  +  g · Δ        residual, every layer</text><rect x="30" y="250" width="540" height="58" rx="4" class="bxd"/><text x="46" y="270" class="lblf">--positional_qk</text><text x="46" y="286" class="sub">Q and K are replaced by sinusoidal PE × 20 — alignment is</text><text x="46" y="300" class="sub">hardcoded, not learned. --qk_content_residual adds the</text><text x="46" y="314" class="sub">zero-init projections back on top.</text></svg>